name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: brew install llvm
      - run: npm ci
      - name: Verify tag matches package version
        run: |
          package_version=$(node --input-type=module --eval "import pkg from './package.json' with { type: 'json' }; console.log(pkg.version)")
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: npm run check
      - run: npm publish
